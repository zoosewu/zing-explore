# git-cliff：依慣例式提交（Conventional Commits）產生 GitHub Release 的說明（.github/workflows/release.yml）。
# 只列出上一個標籤到這個標籤之間、符合格式的 commit（`類型(範圍): 說明`），依類型分組；不符合格式的不列出。
# 本機預覽：git-cliff --unreleased --tag v0.2.0

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**不相容的變更**：{% endif %}{{ commit.message | trim }}{% if commit.scope %}（{{ commit.scope }}）{% endif %}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
# 分組的順序以 HTML 註解的數字決定（顯示時去掉）
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->新功能" },
  { message = "^fix", group = "<!-- 1 -->修正" },
  { message = "^perf", group = "<!-- 2 -->效能" },
  { message = "^refactor", group = "<!-- 3 -->重構" },
  { message = "^docs", group = "<!-- 4 -->文件" },
  { message = "^(test|build|ci|chore|style)", group = "<!-- 5 -->其他" },
]
