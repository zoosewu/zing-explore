# 發佈：push v* 標籤（v主.次.修補）時以標籤的版本號測試（clippy、單元測試、冒煙測試、效能）、建置，
# 建立 GitHub Release（說明由 git-cliff 依慣例式提交產生，見 cliff.toml），再把版本號 commit 回 master。
# 也可以手動執行（Actions → release → Run workflow）：在分支上只測試與建置不發佈，選標籤時會發佈。
# 最新版固定在 https://github.com/<owner>/<repo>/releases/latest/download/zing-explore-windows-x64.zip
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      allow_regression:
        description: '效能退步只顯示、不擋發佈（刻意接受的取捨；門檻超標仍然失敗）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  ASSET: zing-explore-windows-x64.zip
  LUALS_VERSION: '3.13.6'
  GIT_CLIFF_VERSION: '2.8.0'
  GH_TOKEN: ${{ github.token }}

defaults:
  run:
    shell: pwsh

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 測試資料夾
        # 冒煙測試、效能測試的測試資料（zing_core::testdir）；路徑不可含 ..（Shell 的檔案作業會回報參數不正確）
        run: '"ZING_TEST_DIR=$(Join-Path $env:RUNNER_TEMP ''zing-test'')" >> $env:GITHUB_ENV'

      - name: 版本號取自標籤、確認標籤在 master 上
        if: github.ref_type == 'tag'
        run: |
          $tag = '${{ github.ref_name }}'
          # 預先發行版（-rc.1）不支援：檢查新版本只比較 主.次.修補
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') { throw "標籤 $tag 的格式需為 v主.次.修補（例如 v0.2.0）" }
          $ver = $Matches[1]
          git fetch origin master
          git merge-base --is-ancestor $env:GITHUB_SHA origin/master
          if ($LASTEXITCODE -ne 0) { throw "標籤 $tag 的 commit 不在 master 上" }
          # 以標籤的版本建置（執行檔的版本資訊、檢查新版本用的目前版本）
          pwsh -NoProfile tools/set-version.ps1 $ver
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "VERSION=$ver" >> $env:GITHUB_ENV

      - name: 安裝 rust-toolchain.toml 指定的工具鏈
        run: |
          $channel = [regex]::Match((Get-Content rust-toolchain.toml -Raw), 'channel\s*=\s*"([^"]+)"').Groups[1].Value
          rustup toolchain install $channel --profile minimal --component clippy
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo clippy -p zing-app --all-targets --features smoke -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # 測試、冒煙測試、效能的輸出另存一份，失敗時以 tools/ci-annotate.ps1 把原因輸出成錯誤摘要
      # （執行頁面上直接看得到，不登入也能從 API 讀取）
      - name: 單元測試
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'test.log'
          # 一個 crate 失敗時其他 crate 照樣跑，一次看到所有失敗
          cargo test --workspace --no-fail-fast 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          pwsh -NoProfile tools/ci-annotate.ps1 -Log $log -Kind test -ExitCode $code
          exit $code

      - name: 安裝 Lua Language Server（冒煙測試前檢查 Lua API）
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'luals'
          gh release download $env:LUALS_VERSION --repo LuaLS/lua-language-server --pattern '*-win32-x64.zip' --dir $dir
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Expand-Archive (Get-ChildItem $dir -Filter *.zip).FullName $dir
          "LUALS=$(Join-Path $dir 'bin\lua-language-server.exe')" >> $env:GITHUB_ENV

      - name: 冒煙測試（release）
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'smoke.log'
          pwsh -NoProfile tools/smoke.ps1 -Release -TimeoutSec 600 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          pwsh -NoProfile tools/ci-annotate.ps1 -Log $log -Kind smoke -ExitCode $code
          exit $code

      - name: 上一個 Release 的效能結果（CI 的基準）
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'baseline'
          New-Item -ItemType Directory -Force $dir | Out-Null
          # 沒有 Release 或舊的 Release 沒有附結果時只檢查門檻
          $latest = gh release view --repo $env:GITHUB_REPOSITORY --json tagName -q .tagName 2>$null
          if ($LASTEXITCODE -eq 0 -and $latest) {
            gh release download $latest --repo $env:GITHUB_REPOSITORY --pattern perf.json --dir $dir 2>$null
            Write-Host "基準：$latest"
          }
          $global:LASTEXITCODE = 0
          "PERF_BASELINE=$(Join-Path $dir 'perf.json')" >> $env:GITHUB_ENV

      - name: 效能檢查
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'dist'
          New-Item -ItemType Directory -Force $dist | Out-Null
          $extra = if ('${{ inputs.allow_regression }}' -eq 'true') { @('-AllowRegression') } else { @() }
          # 每次分到的機器不同，相對容差比本機（5%）寬
          $log = Join-Path $env:RUNNER_TEMP 'perf.log'
          pwsh -NoProfile tools/perf.ps1 -BaselineFile $env:PERF_BASELINE -RelTolerance 0.15 -Out (Join-Path $dist 'perf.json') @extra 2>&1 |
            ForEach-Object { "$_" } | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          pwsh -NoProfile tools/ci-annotate.ps1 -Log $log -Kind perf -ExitCode $code
          exit $code

      - name: 建置與打包
        run: |
          # perf.ps1 已重新建置不含冒煙測試的 zing.exe；這裡補上 zing-index
          cargo build --release -p zing-app -p zing-index
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # 確認不是冒煙測試的版本：收到 --smoke-* 參數時結束代碼為 2
          $p = Start-Process target\release\zing.exe -ArgumentList '--smoke-out=x' -PassThru -Wait
          if ($p.ExitCode -ne 2) { throw "zing.exe 含有冒煙測試功能（結束代碼 $($p.ExitCode)）" }
          $dist = Join-Path $env:RUNNER_TEMP 'dist'
          $zip = Join-Path $dist $env:ASSET
          Compress-Archive -Path target\release\zing.exe, target\release\zing-index.exe, LICENSE -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Set-Content "$zip.sha256" "$hash  $env:ASSET" -NoNewline -Encoding ascii
          Get-ChildItem $dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zing-explore
          path: |
            ${{ runner.temp }}\dist
            target\smoke
          if-no-files-found: ignore

      - name: Release 說明（git-cliff，依慣例式提交）
        if: github.ref_type == 'tag'
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'git-cliff'
          gh release download "v$env:GIT_CLIFF_VERSION" --repo orhun/git-cliff --pattern "git-cliff-$env:GIT_CLIFF_VERSION-x86_64-pc-windows-msvc.zip" --dir $dir
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Expand-Archive (Get-ChildItem $dir -Filter *.zip).FullName $dir
          $cliff = (Get-ChildItem $dir -Recurse -Filter git-cliff.exe | Select-Object -First 1).FullName
          # 上一個標籤到這個標籤之間的 commit
          $changes = (& $cliff --config cliff.toml --current --strip all) -join "`n"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>$null | Out-Null
          $first = $LASTEXITCODE -ne 0
          $global:LASTEXITCODE = 0
          if (-not $changes.Trim()) { $changes = if ($first) { '第一個公開版本。' } else { '這個版本沒有列出的變更。' } }
          $install = '下載 `zing-explore-windows-x64.zip`，解壓縮到一般使用者可寫入的資料夾（不要放在 Program Files）後執行 `zing.exe`。' +
            '已經在用的 zing 會在狀態列提示新版本，點了即可下載並安裝。'
          $notes = Join-Path $env:RUNNER_TEMP 'notes.md'
          Set-Content $notes "$($changes.Trim())`n`n---`n`n$install" -Encoding utf8
          Get-Content $notes
          "NOTES_FILE=$notes" >> $env:GITHUB_ENV

      - name: 建立 Release
        if: github.ref_type == 'tag'
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'dist'
          gh release create '${{ github.ref_name }}' --repo $env:GITHUB_REPOSITORY --title '${{ github.ref_name }}' --notes-file $env:NOTES_FILE `
            (Join-Path $dist $env:ASSET) (Join-Path $dist "$env:ASSET.sha256") (Join-Path $dist 'perf.json')
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 版本號 commit 回 master（chore(release)）
        if: github.ref_type == 'tag'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # 發佈期間 master 可能又有新的 commit：在最新的 master 上改版本號
          git fetch origin master
          git checkout -f -B release-version origin/master
          pwsh -NoProfile tools/set-version.ps1 $env:VERSION
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # 更新 Cargo.lock 中本專案的版本
          cargo metadata --format-version 1 --offline | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git add Cargo.toml Cargo.lock
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "master 的版本已是 $env:VERSION"; exit 0 }
          git commit -m "chore(release): v$env:VERSION"
          git push origin HEAD:master
          if ($LASTEXITCODE -ne 0) { exit 1 }
