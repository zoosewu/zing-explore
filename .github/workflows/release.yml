# 發佈：push v* 標籤（v主.次.修補，可帶 -預先發行）時以標籤的版本號測試（clippy、單元測試、冒煙測試、效能）、建置、打包，
# 發佈交給 zoo-release 的共用流程（簽章、sha256、latest.json、Release 說明，見 https://github.com/zoosewu/zoo-release
# 的 docs/RELEASE.md），最後把版本號 commit 回 master。
# 也可以手動執行（Actions → release → Run workflow）：在分支上只測試與建置不發佈，選標籤時會發佈。
# 最新版固定在 https://github.com/<owner>/<repo>/releases/latest/download/zing-explore-windows-x64.zip
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      allow_regression:
        description: '效能退步只顯示、不擋發佈（刻意接受的取捨；門檻超標仍然失敗）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  ASSET: zing-explore-windows-x64.zip
  LUALS_VERSION: '3.13.6'
  GH_TOKEN: ${{ github.token }}

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 測試資料夾
        # 冒煙測試、效能測試的測試資料（zing_core::testdir）；路徑不可含 ..（Shell 的檔案作業會回報參數不正確）
        run: '"ZING_TEST_DIR=$(Join-Path $env:RUNNER_TEMP ''zing-test'')" >> $env:GITHUB_ENV'

      - name: 版本號取自標籤、確認標籤在 master 上
        id: version
        if: github.ref_type == 'tag'
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)(-[0-9A-Za-z.-]+)?$') { throw "標籤 $tag 的格式需為 v主.次.修補（例如 v0.7.0、v0.7.0-rc.1）" }
          # 執行檔的版本只用 主.次.修補（檢查新版本以它比較；預先發行版不會成為 latest，已安裝的 zing 收不到）
          $ver = $Matches[1]
          $pre = [bool]$Matches[2]
          git fetch origin master
          git merge-base --is-ancestor $env:GITHUB_SHA origin/master
          if ($LASTEXITCODE -ne 0) { throw "標籤 $tag 的 commit 不在 master 上" }
          pwsh -NoProfile tools/set-version.ps1 $ver
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "version=$ver" >> $env:GITHUB_OUTPUT
          "prerelease=$($pre.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: 安裝 rust-toolchain.toml 指定的工具鏈
        run: |
          $channel = [regex]::Match((Get-Content rust-toolchain.toml -Raw), 'channel\s*=\s*"([^"]+)"').Groups[1].Value
          rustup toolchain install $channel --profile minimal --component clippy
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo clippy -p zing-app --all-targets --features smoke -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # 測試、冒煙測試、效能的輸出另存一份，失敗時以 tools/ci-annotate.ps1 把原因輸出成錯誤摘要
      # （執行頁面上直接看得到，不登入也能從 API 讀取）
      - name: 單元測試
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'test.log'
          # 一個 crate 失敗時其他 crate 照樣跑，一次看到所有失敗
          cargo test --workspace --no-fail-fast 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          pwsh -NoProfile tools/ci-annotate.ps1 -Log $log -Kind test -ExitCode $code
          exit $code

      - name: 安裝 Lua Language Server（冒煙測試前檢查 Lua API）
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'luals'
          gh release download $env:LUALS_VERSION --repo LuaLS/lua-language-server --pattern '*-win32-x64.zip' --dir $dir
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Expand-Archive (Get-ChildItem $dir -Filter *.zip).FullName $dir
          "LUALS=$(Join-Path $dir 'bin\lua-language-server.exe')" >> $env:GITHUB_ENV

      - name: 冒煙測試（release）
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'smoke.log'
          pwsh -NoProfile tools/smoke.ps1 -Release -TimeoutSec 600 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          pwsh -NoProfile tools/ci-annotate.ps1 -Log $log -Kind smoke -ExitCode $code
          exit $code

      # 每次分到的機器快慢差很多（同一版的主題切換 14～23 ms），拿上一版在別台機器量的結果比較會誤判退步；
      # 同一台機器也會在量測途中變慢（v0.5.0：先量完上一版再量這一版，載入 124 → 175 ms，重跑 119 ms），
      # 所以下載上一個 Release 的 zing.exe，在效能檢查中和這一版交替量
      - name: 下載上一個 Release（效能檢查的基準）
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'baseline'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $baseline = Join-Path $dir 'perf.json'
          # 沒有 Release 時只檢查門檻
          $latest = gh release view --repo $env:GITHUB_REPOSITORY --json tagName -q .tagName 2>$null
          if ($LASTEXITCODE -eq 0 -and $latest) {
            gh release download $latest --repo $env:GITHUB_REPOSITORY --pattern $env:ASSET --dir $dir 2>$null
            $zip = Join-Path $dir $env:ASSET
            if (Test-Path $zip) {
              $old = Join-Path $dir 'old'
              Expand-Archive $zip $old -Force
              $exe = Join-Path $old 'zing.exe'
              if (Test-Path $exe) {
                "PERF_COMPARE_EXE=$exe" >> $env:GITHUB_ENV
                Write-Host "基準：$latest（在這台機器交替量）"
              }
            }
            # 沒有執行檔時退回 Release 附的結果（其他機器量的）
            if (-not (Test-Path (Join-Path $dir 'old\zing.exe'))) {
              gh release download $latest --repo $env:GITHUB_REPOSITORY --pattern perf.json --dir $dir 2>$null
              Write-Host "基準：$latest 附的 perf.json"
            }
          }
          $global:LASTEXITCODE = 0
          "PERF_BASELINE=$baseline" >> $env:GITHUB_ENV

      - name: 效能檢查
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'dist'
          New-Item -ItemType Directory -Force $dist | Out-Null
          # 外層的 @() 不可省：if 運算式回傳單一元素時會變成字串，@extra 展開字串會拆成字元（"-" 被當成 -Runs 的值）
          $extra = @(if ('${{ inputs.allow_regression }}' -eq 'true') { '-AllowRegression' })
          $base = if ($env:PERF_COMPARE_EXE) { @('-CompareExe', $env:PERF_COMPARE_EXE) } else { @('-BaselineFile', $env:PERF_BASELINE) }
          # 每次分到的機器不同，相對容差比本機（5%）寬；資料夾量 5 次，偶發的停頓不影響中位數
          $log = Join-Path $env:RUNNER_TEMP 'perf.log'
          pwsh -NoProfile tools/perf.ps1 @base -FolderRuns 5 -RelTolerance 0.15 -Out (Join-Path $dist 'perf.json') @extra 2>&1 |
            ForEach-Object { "$_" } | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          pwsh -NoProfile tools/ci-annotate.ps1 -Log $log -Kind perf -ExitCode $code
          exit $code

      - name: 建置與打包
        run: |
          # perf.ps1 已重新建置不含冒煙測試的 zing.exe；這裡補上 zing-index
          cargo build --release -p zing-app -p zing-index
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # 確認不是冒煙測試的版本：收到 --smoke-* 參數時結束代碼為 2
          $p = Start-Process target\release\zing.exe -ArgumentList '--smoke-out=x' -PassThru -Wait
          if ($p.ExitCode -ne 2) { throw "zing.exe 含有冒煙測試功能（結束代碼 $($p.ExitCode)）" }
          $dist = Join-Path $env:RUNNER_TEMP 'dist'
          Compress-Archive -Path target\release\zing.exe, target\release\zing-index.exe, LICENSE -DestinationPath (Join-Path $dist $env:ASSET)
          Get-ChildItem $dist | Format-Table Name, Length

      # 發佈的檔案（壓縮檔、效能結果）：zoo-release 收集 release-* 的 artifact，加上 sha256、簽章、latest.json
      - uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag'
        with:
          name: release-windows
          path: ${{ runner.temp }}\dist\*
          if-no-files-found: error

      # 檢查用（失敗時也上傳）：截圖、效能結果
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zing-explore
          path: |
            ${{ runner.temp }}\dist
            target\smoke
          if-no-files-found: ignore

  release:
    needs: build
    if: github.ref_type == 'tag'
    uses: zoosewu/zoo-release/.github/workflows/release.yml@v1
    with:
      name: zing-explore
      platforms: '{"windows-x86_64": "zing-explore-windows-x64.zip"}'
      # 接入 zoo-release 的測試：只建草稿。確認測試 tag 的草稿後移除這一行
      publish: false
    secrets: inherit

  version:
    needs: [build, release]
    if: github.ref_type == 'tag' && needs.build.outputs.prerelease != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 版本號 commit 回 master（chore(release)）
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # 發佈期間 master 可能又有新的 commit：在最新的 master 上改版本號
          git fetch origin master
          git checkout -f -B release-version origin/master
          # 連 Cargo.lock 中本專案的版本一起改（不用 cargo：離線時快取不一定有每個平台的相依套件）
          pwsh -NoProfile tools/set-version.ps1 $env:VERSION
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git add Cargo.toml Cargo.lock
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "master 的版本已是 $env:VERSION"; exit 0 }
          git commit -m "chore(release): v$env:VERSION"
          git push origin HEAD:master
          if ($LASTEXITCODE -ne 0) { exit 1 }
