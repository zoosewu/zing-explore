cmd = "file.delete --permanent"
[[key]]
key = "F2"
cmd = "file.rename"
[[key]]
key = "Ctrl+Shift+N"
cmd = "file.newfolder"
[[key]]
key = "Alt+Enter"
cmd = "file.properties"
[[key]]
key = "Ctrl+Shift+C"
cmd = "file.copypath"
[[key]]
key = "F6"
cmd = "copy --move --to={dest}"
[[key]]
key = "F7"
