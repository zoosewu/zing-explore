# zing-explore 預設設定。使用者設定檔（zing.exe 旁的 config.toml）會覆蓋這裡的值；
# 快速鍵以後定義者為準，cmd = "" 可停用某個預設快速鍵。

# dark | light | system | 使用者主題名稱（zing.exe 旁的 themes\<名稱>.toml）
theme = "system"
show_hidden = false
# 留空表示還原上次的資料夾
start_path = ""
favorites = []

[layout]
# left | right | hidden
tree = "left"

[palette]
# 命令面板（Ctrl+Shift+P）的位置：top（視窗上方）| center（視窗正中央）
position = "top"

[folder_sizes]
# true：進入本機固定磁碟上的資料夾時自動計算子資料夾大小（網路磁碟、隨身碟不自動算）
# false：只在按 Ctrl+Shift+S（view.foldersizes）時計算
auto = false

# ---- 導覽 ----
[[key]]
key = "Alt+Left"
cmd = "nav.back"
[[key]]
key = "MouseBack"
cmd = "nav.back"
[[key]]
key = "BrowserBack"
cmd = "nav.back"
[[key]]
key = "Alt+Right"
cmd = "nav.forward"
[[key]]
key = "MouseForward"
cmd = "nav.forward"
[[key]]
key = "BrowserForward"
cmd = "nav.forward"
[[key]]
key = "Alt+Up"
cmd = "nav.up"
[[key]]
key = "Backspace"
cmd = "nav.up"
[[key]]
key = "Enter"
cmd = "nav.open"
[[key]]
key = "F5"
cmd = "nav.refresh"
[[key]]
key = "Ctrl+L"
cmd = "address.edit"
[[key]]
key = "Alt+D"
cmd = "address.edit"

# ---- 檔案 ----
[[key]]
key = "Ctrl+C"
cmd = "file.copy"
[[key]]
key = "Ctrl+X"
