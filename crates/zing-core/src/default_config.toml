# zing-explore 預設設定。使用者設定檔（zing.exe 旁的 config.toml）會覆蓋這裡的值；
# 快速鍵以後定義者為準，cmd = "" 可停用某個預設快速鍵。

# 介面語言：auto（跟隨 Windows 的顯示語言）| zh-TW | en | ja
language = "auto"
# 內建：system（緊湊，跟隨系統深淺色）| dark | light
#       fluent | balanced（跟隨系統深淺色）| fluent-dark | fluent-light | balanced-dark | balanced-light
# 或使用者主題名稱（zing.exe 旁的 themes\<名稱>.toml，可用 style = "fluent" 以某個風格為基礎）
theme = "system"
show_hidden = false
# 留空表示還原上次的資料夾
start_path = ""
favorites = []

[layout]
# left | right | hidden
tree = "left"

[palette]
# 命令面板（Ctrl+Shift+P）的位置：top（視窗上方）| center（視窗正中央，輸入框固定）| middle（整個面板永遠置中）
position = "top"

# 外部命令縮圖產生器（可多個，先符合的優先，優先於 Windows 的縮圖）。{in} 來源檔、{out} 輸出的 PNG、{size} 邊長。
# 直接啟動程式、不經過命令殼層。產生的縮圖快取在 %LOCALAPPDATA%\zing-explore\thumbs（依路徑、修改時間、大小判斷是否重做）。
# [[thumbnailer]]
# match = "*.stl;*.3mf"
# cmd = 'stl-thumb -s {size} "{in}" "{out}"'

[command_bar]
# 工具列下方的命令列（新增、剪下、複製、貼上…）
visible = true
# false：按鈕只顯示圖示
labels = true

[context_menu]
# 右鍵選單：compact（先顯示常用項目，立即出現；「顯示更多選項」或 Shift+右鍵開啟完整的 Windows 選單）| full（直接顯示完整的 Windows 選單）
style = "compact"
# true：讓選單變慢的第三方項目（自動偵測）只在「顯示更多選項」中；false 時照樣放在第一層
hide_slow = true
# 緩慢但照樣放在第一層的擴充功能（CLSID；設定頁「右鍵選單」可逐一切換）
allow_slow = []

[folder_sizes]
# 有 NTFS 索引服務（命令面板：啟用 NTFS 索引服務）時，大小一律由索引立即提供，不受這個設定影響。
# 沒有索引時（服務未啟用、非 NTFS 磁碟）：
# true：進入本機固定磁碟上的資料夾時，以背景優先權逐資料夾計算子資料夾大小（網路磁碟、隨身碟不自動算）
# false：只在按 Ctrl+Shift+S（view.foldersizes）時計算
auto = true

[update]
# 啟動時檢查新版本：距上次檢查超過 24 小時才連線到 GitHub（每天最多一次），
# 只在有功能更新（主版號或次版號較新）時於狀態列提示，可下載並安裝
check = true

