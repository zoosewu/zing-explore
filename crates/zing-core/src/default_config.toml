[[key]]
key = "Ctrl+H"
cmd = "view.togglehidden"
[[key]]
key = "Ctrl+1"
cmd = "view.sort --by=name"
[[key]]
key = "Ctrl+2"
cmd = "view.sort --by=modified"
[[key]]
key = "Ctrl+3"
cmd = "view.sort --by=type"
[[key]]
