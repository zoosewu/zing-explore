# zing-explore の既定の設定。ユーザー設定ファイル（zing.exe の隣の config.toml）の値が優先されます。
# ショートカットは後の定義が優先され、cmd = "" で既定のショートカットを無効にできます。

# 表示言語：auto（Windows の表示言語に従う）| zh-TW | en | ja
language = "auto"
# 組み込み：system（コンパクト、システムの明暗に従う）| dark | light
#           fluent | balanced（システムの明暗に従う）| fluent-dark | fluent-light | balanced-dark | balanced-light
# またはユーザーテーマの名前（zing.exe の隣の themes\<名前>.toml。style = "fluent" でスタイルを基にできる）
theme = "system"
show_hidden = false
# 空なら前回のフォルダーを復元
start_path = ""
favorites = []

[layout]
# left | right | hidden
tree = "left"

[palette]
# コマンドパレット（Ctrl+Shift+P）の位置：top（ウィンドウ上部）| center（ウィンドウ中央、入力欄は固定）| middle（パネル全体を常に中央に）
position = "top"

# 外部コマンドによるサムネイル生成（複数可。先に一致したものが優先され、Windows のサムネイルより優先）。{in} 元ファイル、{out} 出力する PNG、{size} 一辺の長さ。
# シェルを介さずにプログラムを直接起動します。サムネイルは %LOCALAPPDATA%\zing-explore\thumbs にキャッシュされます（パス、更新日時、サイズで作り直すか判断）。
# [[thumbnailer]]
# match = "*.stl;*.3mf"
# cmd = 'stl-thumb -s {size} "{in}" "{out}"'

[command_bar]
# ツールバーの下のコマンドバー（新規作成、切り取り、コピー、貼り付け…）
visible = true
# false：ボタンはアイコンだけ
labels = true

[context_menu]
# 右クリックメニュー：compact（よく使う項目を先に表示してすぐに出る。「その他のオプションを確認」か Shift+右クリックで Windows の完全なメニュー）| full（Windows の完全なメニューをすぐに表示）
style = "compact"
# true：メニューを遅くするサードパーティの項目（自動検出）は「その他のオプションを確認」の中だけ。false のときは最初の階層にも表示
hide_slow = true
# 遅くても最初の階層に表示する拡張機能（CLSID。設定ページの「右クリックメニュー」で個別に切り替えられる）
allow_slow = []

[folder_sizes]
# NTFS インデックス サービス（コマンドパレット：NTFS インデックス サービスを有効にする）があるときは、サイズは常にインデックスからすぐに得られ、この設定は影響しません。
# インデックスがないとき（サービスが無効、NTFS 以外のドライブ）：
# true：ローカルの固定ドライブのフォルダーに入ったとき、バックグラウンドの優先度でサブフォルダーのサイズを計算（ネットワークドライブ、USB メモリは自動では計算しない）
# false：Ctrl+Shift+S（view.foldersizes）を押したときだけ計算
auto = true

