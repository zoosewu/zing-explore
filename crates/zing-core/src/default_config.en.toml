# zing-explore default settings. The user config file (config.toml next to zing.exe) overrides these values;
# for shortcuts the later definition wins, and cmd = "" disables a default shortcut.

# UI language: auto (follows the Windows display language) | zh-TW | en | ja
language = "auto"
# Built-in: system (compact, follows system light/dark) | dark | light
#           fluent | balanced (follow system light/dark) | fluent-dark | fluent-light | balanced-dark | balanced-light
# or a user theme name (themes\<name>.toml next to zing.exe; style = "fluent" uses a style as the base)
theme = "system"
show_hidden = false
# empty restores the last folder
start_path = ""
favorites = []

[layout]
# left | right | hidden
tree = "left"

[palette]
# Command palette (Ctrl+Shift+P) position: top (top of the window) | center (window center, input stays put) | middle (whole panel always centered)
position = "top"

# External thumbnail generators (several allowed, the first match wins, before Windows thumbnails). {in} source file, {out} output PNG, {size} edge length.
# The program is started directly, not through a shell. Thumbnails are cached in %LOCALAPPDATA%\zing-explore\thumbs (redone when path, modification time or size change).
# [[thumbnailer]]
# match = "*.stl;*.3mf"
# cmd = 'stl-thumb -s {size} "{in}" "{out}"'

[command_bar]
# The command bar below the toolbar (New, Cut, Copy, Paste…)
visible = true
# false: buttons show icons only
labels = true

[folder_sizes]
# With the NTFS index service (command palette: Enable NTFS index service), sizes always come instantly from the index and this setting has no effect.
# Without the index (service not enabled, non-NTFS drives):
# true: when entering a folder on a local fixed drive, calculate subfolder sizes folder by folder at background priority (not for network or removable drives)
# false: calculate only when Ctrl+Shift+S (view.foldersizes) is pressed
auto = true

