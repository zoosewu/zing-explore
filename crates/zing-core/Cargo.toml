[package]
name = "zing-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# 批次重新命名的規則運算式（為何不用 regex-lite：見 docs/decisions.md）
regex = "1"
serde.workspace = true
toml.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Time",
]

[dev-dependencies]
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "core"
harness = false
