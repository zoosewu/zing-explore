"惰性求值、不可變、純函式、組合。管線以 `|` 串接：`來源 | 步驟 | 步驟 | 終點`；來源可以是清單（如 `sel()`）或 `seq(...)`。步驟（`map`、`filter`…）只描述要做什麼，到終點（`list`、`each`、`reduce`…）才逐項計算。除了 `each` 與 `is_dir`，這些函式都是純函式；回傳的清單不可修改。管線是運算式，Lua 不允許單獨寫成一行（`sel() | each(f)` 是語法錯誤）：把結果指定給變數，或只為副作用時用方法呼叫 `seq(sel()):each(f)`。" = "Lazy evaluation, immutability, pure functions, composition. Pipelines are chained with `|`: `source | stage | stage | sink`; the source can be a list (such as `sel()`) or `seq(...)`. Stages (`map`, `filter`…) only describe what to do; nothing is computed until a sink (`list`, `each`, `reduce`…). Except for `each` and `is_dir`, these are pure functions; returned lists cannot be modified. A pipeline is an expression, and Lua does not allow it alone on a line (`sel() | each(f)` is a syntax error): assign the result to a variable, or for side effects only use a method call `seq(sel()):each(f)`."
