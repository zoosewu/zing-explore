"惰性求值、不可變、純函式、組合。管線以 `|` 串接：`來源 | 步驟 | 步驟 | 終點`；來源可以是清單（如 `sel()`）或 `seq(...)`。步驟（`map`、`filter`…）只描述要做什麼，到終點（`list`、`each`、`reduce`…）才逐項計算。除了 `each` 與 `is_dir`，這些函式都是純函式；回傳的清單不可修改。管線是運算式，Lua 不允許單獨寫成一行（`sel() | each(f)` 是語法錯誤）：把結果指定給變數，或只為副作用時用方法呼叫 `seq(sel()):each(f)`。" = "遅延評価、不変、純粋関数、合成。パイプラインは `|` でつなぐ：`ソース | 段階 | 段階 | 終端`。ソースはリスト（`sel()` など）または `seq(...)`。段階（`map`、`filter`…）は何をするかを記述するだけで、終端（`list`、`each`、`reduce`…）に来て初めて 1 項目ずつ計算される。`each` と `is_dir` 以外は純粋関数で、返されるリストは変更できない。パイプラインは式なので、Lua では単独の行として書けない（`sel() | each(f)` は構文エラー）：結果を変数に代入するか、副作用だけが目的ならメソッド呼び出し `seq(sel()):each(f)` を使う。"
