[workspace]
resolver = "3"
members = ["crates/zing-core", "crates/zing-app", "crates/zing-index"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
zing-core = { path = "crates/zing-core" }
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "display"] }
windows = "0.62"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# 冒煙測試用的 debug build：與 release 相同的 panic = "abort"，Lua 的錯誤若穿過 Rust 的框架，
# debug 的冒煙測試就會當掉，不必等到 release（見 crates/zing-app/src/script.rs 開頭）
[profile.debug-abort]
inherits = "dev"
panic = "abort"

# 保留符號的 release，供 WPR/Tracy 效能分析使用
[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"
